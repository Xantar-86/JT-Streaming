plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    packagingOptions {
        jniLibs {
            pickFirsts += [
                    "lib/x86_64/libc++_shared.so",
                    "lib/arm64-v8a/libc++_shared.so",
                    "lib/armeabi-v7a/libc++_shared.so",
                    "lib/x86/libc++_shared.so",

                    "lib/x86_64/libass.so",
                    "lib/arm64-v8a/libass.so",
                    "lib/armeabi-v7a/libass.so",
                    "lib/x86/libass.so",
            ]
        }
    }
    namespace = "nl.jknaapen.fladder"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // Required for java 8+ library desugaring (flutter_local_notifications and others)
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose = true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "nl.jknaapen.fladder"
        minSdkVersion flutter.minSdkVersion
        targetSdk = 37
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.6.4'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release

            packagingOptions {
                resources {
                    excludes += ["assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"]
                }
            }
        }
    }

    // JT-HOOK: abi-version-code (WP2.14) - bij --split-per-abi: versionCode = 10 x build-number + ABI-cijfer
    // (armeabi-v7a 1, arm64-v8a 2, x86_64 4) i.p.v. Flutters 1000 x ABI + build-number. Zo ligt elke
    // ABI-apk hoger dan de universele apk met hetzelfde build-number en volgt elke nieuwe versie de
    // vorige op. Draait na Flutters configureEach (die plugin is eerst toegepast), dus wint deze.
    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def abiDigit = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4][output.getFilter(com.android.build.OutputFile.ABI)]
            if (abiDigit != null) {
                output.versionCodeOverride = variant.versionCode * 10 + abiDigit
            }
        }
    }

    flavorDimensions "default"
    productFlavors {
        development {
            dimension "default"
            applicationIdSuffix ".dev"
        }
        production {
            dimension "default"
            applicationIdSuffix ""
            // JT-HOOK: android-id (eigen package, naast Fladder installeerbaar)
            applicationId = "be.thoelen.jtstreaming"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation('androidx.compose.material3:material3')
    implementation('androidx.compose.ui:ui-tooling-preview')
    debugImplementation('androidx.compose.ui:ui-tooling')
    implementation('androidx.activity:activity-compose:1.12.1')

    // Required for Java 8+ desugaring used by some libraries
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Media3 (ExoPlayer)
    def media3_version = "1.8.0+1"
    implementation("androidx.media3:media3-exoplayer:$media3_version")
    implementation("androidx.media3:media3-session:$media3_version")
    implementation("androidx.media3:media3-ui:$media3_version")

    implementation("androidx.media3:media3-exoplayer-dash:$media3_version")
    implementation("androidx.media3:media3-exoplayer-hls:$media3_version")
    implementation("org.jellyfin.media3:media3-ffmpeg-decoder:$media3_version")
    implementation("io.github.peerless2012:ass-media:0.3.0")

    //UI
    implementation("io.github.rabehx:iconsax-compose:0.0.5")
    implementation("io.coil-kt.coil3:coil-compose:3.3.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.3.0")
    implementation("com.materialkolor:material-kolor:4.0.5")

    // JT-HOOK: jvm-unit-tests (WP2.12) - plain JVM tests in src/test
    testImplementation("junit:junit:4.13.2")
}
